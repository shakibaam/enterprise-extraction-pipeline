# Country profile: UNITED STATES. *** DRAFT, UNTESTED (2026-11-24) ***
# Written so that the pipeline is ready for US registries; nothing here has been run or measured. Before trusting a US run: check the
# queries on a sample (search results), the foreign-site lists, and precision/recall with the judge. The location check is OFF: there
# is no US location locale yet (shared/foreign_pages.py has only "ca"); write one (home signals: states, ZIP codes; foreign: Canada, UK, ...)
# and turn it on. Prompts in prompts/us/ are the Canadian ones with "Canadian" -> "US" and "province" explained as the state.
code = "US"
name = "United States"
status = "draft"
region_label = "state"

