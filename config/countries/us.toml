[config.search]
# DRAFT: US state filings live with each Secretary of State; "business entity search" is the usual name of those registries.
queries = [
  { id = "Q02", category = "registry", template = '"{name}" {region} secretary of state business entity' },
  { id = "Q06", category = "contact",  template = '"{name}" {region} address contact' },
  { id = "Q11", category = "registry", template = '"{name}" {region} public records' },
]

[config.search.serper]
country = "us"
language = "en"

[config.rerank]
country = "United States"

[config.select.foreign_sites]
# DRAFT: the Canadian lists turned around: non-US country domains (.ca included, .us excluded), Canadian registries and directories.
enabled = true
country_domains = [".ca", ".uk", ".nz", ".au", ".ie", ".in", ".za", ".sg", ".hk", ".ky", ".bs", ".bm", ".vg", ".de", ".fr", ".nl", ".be",
                   ".ch", ".at", ".it", ".es", ".pt", ".pl", ".se", ".no", ".dk", ".fi", ".jp", ".cn", ".kr", ".tw", ".br", ".mx", ".ar",
                   ".cl", ".ae", ".ph", ".my", ".pk", ".ng", ".ke", ".gh"]
hosts = ["opengovca.com", "canadacompanyregistry.com", "ic.gc.ca", "ised-isde.canada.ca", "companiesnz.com",
         "ukfirmiq.com"]
path_countries = ["canada", "ca", "united-kingdom", "uk", "gb", "great-britain", "england", "scotland", "wales", "northern-ireland",
                  "ireland", "new-zealand", "nz", "australia", "au", "india"]
opencorporates_outside_canada = true      # the switch for the OpenCorporates rule (name kept for compatibility): pages outside the home
opencorporates_home = "us"

[config.select.location]
enabled = false                           # no US locale yet (see the note at the top)
locale = "us"
foreign_min = 2
overwhelming_min = 10
overwhelming_ratio = 10
same_site = true
sole_proprietorship_other_province = false

[config.extraction]
prompt_file = "on_the_fly_pipeline/prompts/us/extract.txt"
chunk_sizing_prompt_file = "on_the_fly_pipeline/prompts/us/chunk_sizing.txt"
country = "United States"

[config.verification]
prompt_file = "on_the_fly_pipeline/prompts/us/verify.txt"
registry_record_file = "on_the_fly_pipeline/prompts/us/registry_record.txt"
